<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#587363" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>值班病患管理系統</title>
    <meta name="apple-mobile-web-app-title" content="值班系統" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Registration -->
    <script>
      const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname) || location.hostname.startsWith('10.') || location.hostname.startsWith('192.168.');
      if ('serviceWorker' in navigator && isLocalDev) {
        // Dev: unregister any stale SW and clear its caches so vite always serves fresh code
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        if ('caches' in window) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('PWA Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.error('Service Worker registration failed:', err);
            });
        });
      }

    </script>
  </body>
</html>
